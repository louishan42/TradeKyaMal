name: Auto Prediction

# Pipeline runs on CP3405_Group_4 only (evidence lives there).
# This workflow is manual-only for local testing — no schedule.
on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      MPLBACKEND: Agg
      TZ: Asia/Singapore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install openai google-generativeai yfinance

      - name: Compute project week
        id: week
        shell: bash
        run: |
          START_DATE="2026-05-25"
          CURRENT_DATE=$(date +%F)

          START_SECS=$(date -d "$START_DATE" +%s)
          CURRENT_SECS=$(date -d "$CURRENT_DATE" +%s)
          DAYS_PASSED=$(( (CURRENT_SECS - START_SECS) / 86400 ))
          PROJECT_WEEK=$(( (DAYS_PASSED - 1) / 7 + 1 ))

          if [ "$PROJECT_WEEK" -lt 1 ]; then
            echo "Invalid project week: $PROJECT_WEEK"
            exit 1
          fi

          echo "week=$PROJECT_WEEK" >> "$GITHUB_OUTPUT"
          echo "Running Project Week: $PROJECT_WEEK"

      - name: Pipeline disabled — use group repo
        run: |
          echo "::error::Scheduled pipeline runs on wintwah-lwin/CP3405_Group_4 only."
          echo "Evidence is stored in CP3405_Group_4/evidence/ — not this repo."
          echo "Go to CP3405_Group_4 → Actions → Auto Prediction → Run workflow."
          exit 1
