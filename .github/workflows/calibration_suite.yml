name: Run Calibration & Accuracy Suite

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number to calibrate (e.g. 9)'
        required: true
        default: '9'
        type: string

permissions:
  contents: write

jobs:
  run-calibration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run calibration suite
        run: |
          python scripts/run_calibration_suite.py --week ${{ inputs.week }} --repo .

      - name: Auto-commit and push
        shell: bash
        run: |
          chmod +x scripts/git_push_evidence.sh
          scripts/git_push_evidence.sh \
            "${{ github.ref_name }}" \
            "auto: generate calibration reports for Week ${{ inputs.week }}"
